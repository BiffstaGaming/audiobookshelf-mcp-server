# Example: run the MCP server next to Audiobookshelf and expose it over HTTP.
# Copy .env.example to .env and fill it in first.
services:
  audiobookshelf-mcp:
    image: ghcr.io/biffstagaming/audiobookshelf-mcp-server:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - '3000:3000'
